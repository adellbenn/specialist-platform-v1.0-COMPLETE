version: '3.9'

# ════════════════════════════════════════════════════════
# Monitoring Stack — Prometheus + Grafana + Jaeger + OTel Collector
# Usage: docker-compose -f docker-compose.monitoring.yml up -d
# Grafana: http://localhost:3002 (admin/admin)
# Prometheus: http://localhost:9090
# Jaeger: http://localhost:16686
# OTel Collector: http://localhost:4317 (gRPC) / http://localhost:4318 (HTTP)
# ════════════════════════════════════════════════════════

services:
  # ─── OpenTelemetry Collector ─────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: specialist_otel_collector
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./infrastructure/monitoring/otel-collector-config.yml:/etc/otel-collector-config.yml:ro
    ports:
      - "127.0.0.1:4317:4317"   # OTLP gRPC (localhost فقط)
      - "127.0.0.1:4318:4318"   # OTLP HTTP (localhost فقط)
      - "127.0.0.1:8889:8889"   # Prometheus metrics (localhost فقط)
    networks:
      - monitoring

  # ─── Jaeger (Tracing UI) ─────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: specialist_jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"  # Jaeger UI
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - monitoring

  # ─── Prometheus ──────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: specialist_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks:
      - monitoring

  # ─── Grafana ─────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: specialist_grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3000"    # موثق على localhost فقط (لا يُكشف خارج الجهاز)
    environment:
      # كلمات المرور تُؤخذ من البيئة ولا يُقبل أي افتراضي آمن (fail-safe):
      # إن لم تُعطَ GF_ADMIN_USER/GF_ADMIN_PASSWORD يفشل الإقلاع بدل استخدام admin/admin.
      # عيّنها في docker-compose.monitoring.env عبر:
      #   GF_ADMIN_USER=myuser
      #   GF_ADMIN_PASSWORD=<كلمة مرور قوية طويلة>
      GF_SECURITY_ADMIN_USER:     ${GF_ADMIN_USER:?GF_ADMIN_USER must be set (e.g. in docker-compose.monitoring.env) — لا يُسمح بالافتراضي admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:?GF_ADMIN_PASSWORD must be set — لا يُسمح بالافتراضي admin/admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/overview.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - monitoring

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  monitoring:
    driver: bridge
