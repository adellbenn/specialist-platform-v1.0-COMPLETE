name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/specialist-platform

jobs:
  # ════════════════════════════════════════════════════════
  # 1. Format Check
  # ════════════════════════════════════════════════════════
  format-check:
    name: "Format Check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install workspace dependencies
        run: npm ci

      - name: Check backend formatting
        working-directory: apps/backend
        run: npm run format:check

      - name: Check frontend formatting
        working-directory: apps/frontend
        run: npm run format:check

  # ════════════════════════════════════════════════════════
  # 2. Lint
  # ════════════════════════════════════════════════════════
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install workspace dependencies
        run: npm ci

      - name: Lint backend
        working-directory: apps/backend
        run: npm run lint

      - name: Lint frontend
        working-directory: apps/frontend
        run: npm run lint

  # ════════════════════════════════════════════════════════
  # 3. Security Audit
  # ════════════════════════════════════════════════════════
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install workspace dependencies
        run: npm ci

      - name: Audit dependencies (workspace)
        run: npm audit --audit-level=high

  # ════════════════════════════════════════════════════════
  # 4. Type Check
  # ════════════════════════════════════════════════════════
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install workspace dependencies
        run: npm ci

      - name: Type check backend
        working-directory: apps/backend
        run: npx tsc --noEmit

      - name: Type check frontend
        working-directory: apps/frontend
        run: npm run type-check

  # ════════════════════════════════════════════════════════
  # 5. Build
  # ════════════════════════════════════════════════════════
  build-apps:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install workspace dependencies
        run: npm ci

      - name: Build backend
        working-directory: apps/backend
        run: npm run build

      - name: Build frontend
        working-directory: apps/frontend
        run: npm run build

  # ════════════════════════════════════════════════════════
  # 6. Backend Tests + Coverage Gate
  # ════════════════════════════════════════════════════════
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: specialist_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install workspace dependencies
        run: npm ci

      - name: Run tests with coverage
        working-directory: apps/backend
        env:
          DB_TYPE: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: postgres
          DB_PASSWORD: testpassword
          DB_NAME: specialist_test
          JWT_SECRET: test-jwt-secret-for-ci-only-0123456789
          JWT_REFRESH_SECRET: test-refresh-secret-for-ci-only-0123456789
          NODE_ENV: test
        run: npm run test:cov -- --passWithNoTests --forceExit --detectOpenHandles

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: apps/backend/coverage/
          retention-days: 14

  # ════════════════════════════════════════════════════════
  # 7. Frontend Tests (Vitest)
  # ════════════════════════════════════════════════════════
  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install workspace dependencies
        run: npm ci

      - name: Run frontend tests
        working-directory: apps/frontend
        run: npm run test

  # ════════════════════════════════════════════════════════
  # 8. Migration Check
  # ════════════════════════════════════════════════════════
  migrate-check:
    name: Migration Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install workspace dependencies
        run: npm ci

      - name: Build backend
        working-directory: apps/backend
        run: npm run build

      - name: Verify migration files compile
        working-directory: apps/backend
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const dir = path.join('dist', 'database', 'migrations');
            if (!fs.existsSync(dir)) { console.error('Migrations directory not found'); process.exit(1); }
            const files = fs.readdirSync(dir).filter(f => f.endsWith('.js') && !f.endsWith('.d.ts'));
            console.log('Found', files.length, 'migration file(s):', files);
            if (files.length === 0) { console.error('No compiled migration files found'); process.exit(1); }
            files.forEach(f => { require(path.join(process.cwd(), dir, f)); });
            console.log('All migrations loaded successfully');
          "

      - name: Verify DataSource imports cleanly
        working-directory: apps/backend
        run: node -e "require('./dist/database/data-source'); console.log('DataSource import OK')"

  # ════════════════════════════════════════════════════════
  # Quality Gate — all must pass before Docker build
  # ════════════════════════════════════════════════════════
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - format-check
      - lint
      - audit
      - type-check
      - build-apps
      - test-backend
      - test-frontend
      - migrate-check
    steps:
      - name: Check all quality jobs
        run: |
          results=("${{ needs.format-check.result }}" \
                   "${{ needs.lint.result }}" \
                   "${{ needs.audit.result }}" \
                   "${{ needs.type-check.result }}" \
                   "${{ needs.build-apps.result }}" \
                   "${{ needs.test-backend.result }}" \
                   "${{ needs.test-frontend.result }}" \
                   "${{ needs.migrate-check.result }}")
          names=("format-check" "lint" "audit" "type-check" "build" "test-backend" "test-frontend" "migrate-check")
          failed=0
          for i in "${!results[@]}"; do
            echo "${names[$i]}: ${results[$i]}"
            if [[ "${results[$i]}" == "failure" || "${results[$i]}" == "cancelled" ]]; then
              failed=1
            fi
          done
          if [[ $failed -eq 1 ]]; then
            echo "::error::One or more quality gates failed"
            exit 1
          fi
          echo "All quality gates passed"

  # ════════════════════════════════════════════════════════
  # Build Docker Images (master only, after quality gate)
  # ════════════════════════════════════════════════════════
  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [quality-gate]
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./infrastructure/docker/Dockerfile.backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./infrastructure/docker/Dockerfile.frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # NEXT_PUBLIC_API_URL تُثبَّت وقت البناء. حدّد متغير Repository
          # باسم NEXT_PUBLIC_API_URL في GitHub إذا أردت واجهة API خارجية،
          # وإلا تُستخدم القيمة النسبية '/api/v1' عبر nginx.
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}

  # ════════════════════════════════════════════════════════
  # Deploy to Production
  # ════════════════════════════════════════════════════════
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-docker]
    if: github.ref == 'refs/heads/master'
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/specialist-platform
            git pull origin master
            docker-compose --env-file .env.production -f docker-compose.prod.yml up -d --build
            docker system prune -f
            echo "Deployed successfully at $(date)"
